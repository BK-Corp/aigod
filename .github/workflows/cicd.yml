name: CI/CD Pipeline

on:
  push:
    branches: [main, staging, develop]
    tags: ['*']

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  test:
    if: |
      github.ref == 'refs/heads/staging' ||
      github.ref == 'refs/heads/develop' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, server_build]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Test the code
        run: |
          echo "🧪 Test the code..."
          echo "🧪 Test complete."

  package-tag:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, server_build]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Package tag
        run: |
          echo "🧰 Package the code..."
          export ADMIN_DOCKERFILE=Dockerfile
          export TAG=${{ github.ref_name }}
          docker compose build
          docker compose push
          echo "🧰 Package code complete"

  package-dev:
    needs: test
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: [self-hosted, server_build]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Auto Package develop
        run: |
          echo "🧰 Package the code..."
          export TAG=dev
          docker compose build
          docker compose push
          echo "🧰 Package code complete"

  deploy-dev:
    needs: package-dev
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: [self-hosted, server_deploy_2]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Auto Deploy develop
        run: |
          echo "🚀 Deploy service..."
          export TAG=dev
          export MOUNT_SRC='/srv'
          docker compose pull
          docker compose up --build -d --remove-orphans
          docker compose ps
          echo "🚀 Deploy complete."

  release_job:
    needs: package-tag
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted, server_build]
    permissions:
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

  notification:
    needs: [test, package-tag, package-dev, deploy-dev, release_job]
    if: always()
    runs-on: [self-hosted, server_notification]
    steps:
      - name: Send success notification
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        env:
          CONTENT_JSON: >-
            ${{ toJSON(format('✅ CI/CD thành công | Repository: {0} | Ref: {1} | Workflow: {2} | Run: {3}/{0}/actions/runs/{4}', github.repository, github.ref_name, github.workflow, github.server_url, github.run_id)) }}
        run: |
          curl --fail-with-body --location 'https://tunnel.bkholding.vn/send-notification' \
            --header 'Content-Type: application/json' \
            --data "{\"message_thread_code\":\"cicd\",\"content\":${CONTENT_JSON}}"

      - name: Send failure notification
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        env:
          CONTENT_JSON: >-
            ${{ toJSON(format('❌ CI/CD thất bại hoặc bị hủy | Repository: {0} | Ref: {1} | Workflow: {2} | Run: {3}/{0}/actions/runs/{4}', github.repository, github.ref_name, github.workflow, github.server_url, github.run_id)) }}
        run: |
          curl --fail-with-body --location 'https://tunnel.bkholding.vn/send-notification' \
            --header 'Content-Type: application/json' \
            --data "{\"message_thread_code\":\"cicd\",\"content\":${CONTENT_JSON}}"

      - name: Docker cleanup
        if: always()
        run: |
          docker image prune -a --force && docker builder prune -a --force --filter "until=12h"
