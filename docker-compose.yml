version: '3.8'

name: ai_aigod

services:
  aigod:
    build:
      context: .
      dockerfile: Dockerfile
    image: registry.bkholding.vn/ai.aigod.app:${TAG:-0.1.6}
    container_name: ai_aigod_app
    ports:
      # Dùng biến riêng: .env PORT=4173 là port preview local (theo .env.example),
      # không được phép quyết định port host khi deploy (gateway trỏ 21020).
      - "${AIGOD_HOST_PORT:-21020}:8000"
    env_file: .env
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    restart: unless-stopped
